const {useState, useEffect, useRef} = React;

function load(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

/* ---------------- ICONS (inline SVG, style lucide) ---------------- */
function Icon({paths, size = 24, color, fill = "none", strokeWidth = 2, style}) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color || "currentColor"}
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style}>
      {paths}
    </svg>
  );
}

const Pause = (p) => <Icon {...p} paths={<><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></>} />;

/* ---------------- SESSION ---------------- */
function SessionScreen({ initialMinutes, sessionName, onFinish, onCancel }) {
  const [setupMode, setSetupMode] = useState(true);
  const [selectedMinutes, setSelectedMinutes] = useState(initialMinutes || 3);
  const [selectedSound, setSelectedSound] = useState(() => load("respire_sound", "rain"));
  const [secondsLeft, setSecondsLeft] = useState((initialMinutes || 3) * 60);
  const [running, setRunning] = useState(false);
  const [phase, setPhase] = useState("Inspire");
  const [breathScale, setBreathScale] = useState(1);
  const intervalRef = useRef(null);
  const breathRef = useRef(null);
  const audioCtxRef = useRef(null);
  const audioNodesRef = useRef([]);
  const totalSeconds = selectedMinutes * 60;

  useEffect(() => { save("respire_sound", selectedSound); }, [selectedSound]);

  const stopAmbient = () => {
    audioNodesRef.current.forEach((n) => { try { n.stop && n.stop(); } catch (e) {} });
    audioNodesRef.current = [];
  };
  const playAmbient = (soundId) => {
    stopAmbient();
    if (!soundId || soundId === "none") return;
    if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtxRef.current;
    if (ctx.state === "suspended") ctx.resume();
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, ctx.currentTime);
    master.gain.linearRampToValueAtTime(soundId === "bowl" || soundId === "music" ? 0.16 : 0.32, ctx.currentTime + 1.5);
    master.connect(ctx.destination);
    const nodes = [master];
    const mkNoise = () => {
      const size = 2 * ctx.sampleRate;
      const buf = ctx.createBuffer(1, size, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < size; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      return src;
    };
    if (["rain", "ocean", "wind", "fire"].includes(soundId)) {
      const src = mkNoise();
      const filter = ctx.createBiquadFilter();
      const shape = ctx.createGain(); shape.gain.value = 1;
      if (soundId === "rain") { filter.type = "highpass"; filter.frequency.value = 1500; filter.Q.value = 0.5; }
      if (soundId === "ocean") { filter.type = "lowpass"; filter.frequency.value = 450; filter.Q.value = 0.7; }
      if (soundId === "wind") { filter.type = "bandpass"; filter.frequency.value = 700; filter.Q.value = 0.5; }
      if (soundId === "fire") { filter.type = "lowpass"; filter.frequency.value = 800; filter.Q.value = 0.4; }
      src.connect(filter); filter.connect(shape); shape.connect(master);
      src.start();
      nodes.push(src, filter, shape);
      if (soundId === "ocean" || soundId === "wind" || soundId === "fire") {
        const lfo = ctx.createOscillator();
        lfo.frequency.value = soundId === "ocean" ? 0.09 : soundId === "wind" ? 0.18 : 0.6;
        const lfoGain = ctx.createGain();
        lfoGain.gain.value = soundId === "fire" ? 0.25 : 0.45;
        shape.gain.value = soundId === "fire" ? 0.75 : 0.55;
        lfo.connect(lfoGain); lfoGain.connect(shape.gain);
        lfo.start();
        nodes.push(lfo, lfoGain);
      }
    } else if (soundId === "bowl" || soundId === "music") {
      const freqs = soundId === "bowl" ? [196.0, 246.94, 293.66, 392.0] : [261.63, 329.63, 392.0, 523.25];
      freqs.forEach((f, i) => {
        const osc = ctx.createOscillator(); osc.type = "sine"; osc.frequency.value = f;
        const g = ctx.createGain(); g.gain.value = 0.09 - i * 0.012;
        const lfo = ctx.createOscillator(); lfo.frequency.value = 0.04 + i * 0.015;
        const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.03;
        lfo.connect(lfoGain); lfoGain.connect(g.gain);
        osc.connect(g); g.connect(master);
        osc.start(); lfo.start();
        nodes.push(osc, g, lfo, lfoGain);
      });
    }
    audioNodesRef.current = nodes;
  };
  const playChime = () => {
    if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtxRef.current;
    if (ctx.state === "suspended") ctx.resume();
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const osc = ctx.createOscillator(); osc.type = "sine"; osc.frequency.value = f;
      const g = ctx.createGain();
      const t0 = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.22, t0 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.8);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t0); osc.stop(t0 + 1.9);
    });
  };

  const startSession = () => {
    setSecondsLeft(selectedMinutes * 60);
    setSetupMode(false);
  };

  useEffect(() => {
    if (running && secondsLeft > 0) {
      intervalRef.current = setInterval(() => setSecondsLeft((s) => s - 1), 1000);
    }
    return () => clearInterval(intervalRef.current);
  }, [running, secondsLeft]);

  useEffect(() => {
    if (running) playAmbient(selectedSound);
    else stopAmbient();
  }, [running, selectedSound]);

  useEffect(() => {
    if (secondsLeft === 0) {
      playChime();
      setRunning(false);
    }
  }, [secondsLeft]);

  useEffect(() => () => stopAmbient(), []);

  useEffect(() => {
    if (!running) return;
    const cycle = [
      { name: "Inspire", duration: 4 },
      { name: "Retiens", duration: 2 },
      { name: "Expire", duration: 4 },
    ];
    let cycleIndex = 0;
    let elapsedInPhase = 0;

    breathRef.current = setInterval(() => {
      elapsedInPhase += 0.05;
      const current = cycle[cycleIndex];
      const progress = elapsedInPhase / current.duration;

      if (current.name === "Inspire") setBreathScale(1 + progress * 0.35);
      if (current.name === "Retiens") setBreathScale(1.35);
      if (current.name === "Expire") setBreathScale(1.35 - progress * 0.35);

      if (elapsedInPhase >= current.duration) {
        elapsedInPhase = 0;
        cycleIndex = (cycleIndex + 1) % cycle.length;
        setPhase(cycle[cycleIndex].name);
      }
    }, 50);

    return () => clearInterval(breathRef.current);
  }, [running]);

  const minutes = Math.floor(secondsLeft / 60);
  const secs = secondsLeft % 60;
  const progress = 1 - secondsLeft / totalSeconds;
  const circumference = 2 * Math.PI * 130;
  const dashOffset = circumference * (1 - progress);
  const isDone = secondsLeft === 0;

  if (setupMode) {
    return (
      <Shell noPadBottom>
        <div style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
          <button
            onClick={onCancel}
            style={{
              width: "38px",
              height: "38px",
              borderRadius: "50%",
              background: "rgba(255,255,255,0.6)",
              border: "none",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              cursor: "pointer",
            }}
          >
            <XIcon size={18} color="#6B5F52" />
          </button>
          <p style={{ margin: 0, fontSize: "14px", color: "#7A6E5F", fontWeight: 600 }}>{sessionName}</p>
          <div style={{ width: "38px" }} />
        </div>

        <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
          <div
            style={{
              width: "150px",
              height: "150px",
              borderRadius: "50%",
              background: "radial-gradient(circle at 35% 30%, #FFFDF9, #F0C9A8 75%)",
              boxShadow: "0 10px 30px rgba(240, 201, 168, 0.5)",
              marginTop: "36px",
              marginBottom: "36px",
            }}
          />

          <p style={{ margin: "0 0 18px", fontSize: "15px", color: "#7A6E5F", fontWeight: 600, textAlign: "center" }}>
            Combien de temps aujourd'hui ?
          </p>

          <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: "10px", maxWidth: "320px" }}>
            {DURATIONS.map((d) => (
              <button
                key={d}
                onClick={() => setSelectedMinutes(d)}
                style={{
                  minWidth: "64px",
                  padding: "14px 10px",
                  borderRadius: "16px",
                  border: "none",
                  background: selectedMinutes === d ? COLORS.text : COLORS.card,
                  color: selectedMinutes === d ? COLORS.bgTop : COLORS.text,
                  fontWeight: 700,
                  fontSize: "15px",
                  cursor: "pointer",
                  boxShadow: selectedMinutes === d ? "0 8px 18px rgba(74, 64, 56, 0.3)" : "0 4px 12px rgba(180, 160, 140, 0.15)",
                  transition: "all 0.15s ease",
                }}
              >
                {d} min
              </button>
            ))}
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: "18px", marginTop: "22px" }}>
            <button
              onClick={() => setSelectedMinutes((m) => Math.max(1, m - 1))}
              style={{
                width: "36px", height: "36px", borderRadius: "50%", border: "none",
                background: COLORS.card, color: COLORS.text, fontSize: "18px", fontWeight: 700,
                cursor: "pointer", boxShadow: "0 4px 10px rgba(180, 160, 140, 0.15)",
              }}
            >
              –
            </button>
            <p style={{ margin: 0, fontSize: "16px", color: COLORS.text, fontWeight: 700, minWidth: "70px", textAlign: "center" }}>
              {selectedMinutes} min
            </p>
            <button
              onClick={() => setSelectedMinutes((m) => Math.min(60, m + 1))}
              style={{
                width: "36px", height: "36px", borderRadius: "50%", border: "none",
                background: COLORS.card, color: COLORS.text, fontSize: "18px", fontWeight: 700,
                cursor: "pointer", boxShadow: "0 4px 10px rgba(180, 160, 140, 0.15)",
              }}
            >
              +
            </button>
          </div>

          <p style={{ margin: "26px 0 12px", fontSize: "15px", color: "#7A6E5F", fontWeight: 600, textAlign: "center" }}>
            Choisis une ambiance sonore
          </p>
          <div style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", gap: "10px", maxWidth: "320px" }}>
            {AMBIENT_SOUNDS.map((s) => (
              <button
                key={s.id}
                onClick={() => setSelectedSound(s.id)}
                style={{
                  display: "flex", flexDirection: "column", alignItems: "center", gap: "4px",
                  minWidth: "64px", padding: "12px 8px",
                  borderRadius: "16px", border: "none",
                  background: selectedSound === s.id ? COLORS.text : COLORS.card,
                  color: selectedSound === s.id ? COLORS.bgTop : COLORS.text,
                  cursor: "pointer",
                  boxShadow: selectedSound === s.id ? "0 8px 18px rgba(74, 64, 56, 0.3)" : "0 4px 12px rgba(180, 160, 140, 0.15)",
                  transition: "all 0.15s ease",
                }}
              >
                <s.Icon size={18} />
                <span style={{ fontSize: "10px", fontWeight: 700 }}>{s.label}</span>
              </button>
            ))}
          </div>

          <button
            onClick={startSession}
            style={{
              marginTop: "28px",
              display: "flex", alignItems: "center", gap: "8px",
              background: COLORS.text, color: COLORS.bgTop, border: "none",
              borderRadius: "999px", padding: "15px 36px", fontSize: "15px", fontWeight: 700,
              cursor: "pointer", boxShadow: "0 8px 20px rgba(74, 64, 56, 0.3)",
            }}
          >
            <Play size={16} fill={COLORS.bgTop} />
            Commencer
          </button>
        </div>
      </Shell>
    );
  }

  return (
    <Shell noPadBottom>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
        <div style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
          <button
            onClick={onCancel}
            style={{
              width: "38px", height: "38px", borderRadius: "50%",
              background: "rgba(255,255,255,0.6)", border: "none",
              display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
            }}
          >
            <XIcon size={18} color="#6B5F52" />
          </button>
          <p style={{ margin: 0, fontSize: "14px", color: "#7A6E5F", fontWeight: 600 }}>{sessionName}</p>
          <div style={{ width: "38px" }} />
        </div>

        <p
          style={{
            margin: "40px 0 8px", fontSize: "13px", color: COLORS.faint, fontWeight: 600,
            textTransform: "uppercase", letterSpacing: "1px",
          }}
        >
          {running ? phase : isDone ? "Terminé" : "Prête ?"}
        </p>

        <div style={{ position: "relative", width: "300px", height: "300px", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <svg width="300" height="300" style={{ position: "absolute", transform: "rotate(-90deg)" }}>
            <circle cx="150" cy="150" r="130" fill="none" stroke="#F0E7DA" strokeWidth="10" />
            <circle
              cx="150" cy="150" r="130" fill="none" stroke={COLORS.pink} strokeWidth="10" strokeLinecap="round"
              strokeDasharray={circumference} strokeDashoffset={dashOffset}
              style={{ transition: "stroke-dashoffset 1s linear" }}
            />
          </svg>

          <div
            style={{
              width: "160px", height: "160px", borderRadius: "50%",
              background: "radial-gradient(circle at 35% 30%, #FFFDF9, #F0C9A8 75%)",
              transform: `scale(${running ? breathScale * 0.75 : 0.75})`,
              transition: running ? "transform 0.05s linear" : "transform 0.4s ease",
              boxShadow: "0 10px 30px rgba(240, 201, 168, 0.5)",
              display: "flex", alignItems: "center", justifyContent: "center",
            }}
          >
            <p style={{ margin: 0, fontSize: "34px", color: COLORS.text, fontWeight: 700, fontVariantNumeric: "tabular-nums" }}>
              {minutes}:{secs.toString().padStart(2, "0")}
            </p>
          </div>
        </div>

        <p style={{ margin: "36px 0 0", fontSize: "14px", color: COLORS.subtext, textAlign: "center", maxWidth: "260px", lineHeight: 1.5 }}>
          {isDone
            ? "Belle séance. Prends un instant avant de reprendre ta journée."
            : "Suis le mouvement du cercle. Inspire quand il grandit, expire quand il rétrécit."}
        </p>

        <div style={{ marginTop: "32px", display: "flex", alignItems: "center", gap: "20px" }}>
          {!isDone && (
            <button
              onClick={() => setRunning((r) => !r)}
              style={{
                width: "64px", height: "64px", borderRadius: "50%",
                background: COLORS.text, border: "none",
                display: "flex", alignItems: "center", justifyContent: "center",
                cursor: "pointer", boxShadow: "0 8px 20px rgba(74, 64, 56, 0.3)",
              }}
            >
              {running ? (
                <Pause size={24} color={COLORS.bgTop} fill={COLORS.bgTop} />
              ) : (
                <Play size={24} color={COLORS.bgTop} fill={COLORS.bgTop} style={{ marginLeft: "3px" }} />
              )}
            </button>
          )}

          {isDone && (
            <button
              onClick={() => onFinish(selectedMinutes)}
              style={{
                background: COLORS.text, color: COLORS.bgTop, border: "none",
                borderRadius: "999px", padding: "14px 32px", fontSize: "15px", fontWeight: 700,
                cursor: "pointer", display: "flex", alignItems: "center", gap: "8px",
              }}
            >
              <Wind size={16} />
              Comment tu te sens ?
            </button>
          )}
        </div>

        {!isDone && (
          <div style={{ marginTop: "22px", display: "flex", justifyContent: "center", gap: "8px", flexWrap: "wrap", maxWidth: "280px" }}>
            {AMBIENT_SOUNDS.map((s) => (
              <button
                key={s.id}
                onClick={() => setSelectedSound(s.id)}
                style={{
                  width: "34px", height: "34px", borderRadius: "50%", border: "none",
                  background: selectedSound === s.id ? COLORS.card : "transparent",
                  boxShadow: selectedSound === s.id ? "0 4px 10px rgba(180,160,140,0.25)" : "none",
                  color: selectedSound === s.id ? COLORS.text : COLORS.faint,
                  cursor: "pointer",
                  display: "flex", alignItems: "center", justifyContent: "center",
                }}
              >
                <s.Icon size={16} />
              </button>
            ))}
          </div>
        )}
      </div>
    </Shell>
  );
}

/* ---------------- STATS ---------------- */
function StatsScreen({ onBack, sessionsCompleted }) {
  const weekData = [
    { day: "L", minutes: 5 },
    { day: "M", minutes: 8 },
    { day: "M", minutes: 3 },
    { day: "J", minutes: 10 },
    { day: "V", minutes: 0 },
    { day: "S", minutes: 15 },
    { day: "D", minutes: 12 },
  ];
  const maxMinutes = Math.max(...weekData.map((d) => d.minutes), 1);

  const moodData = [
    { label: "Serein", value: 40, color: COLORS.sage },
    { label: "Bien", value: 30, color: COLORS.yellow },
    { label: "Neutre", value: 20, color: COLORS.pink },
    { label: "Tendu", value: 10, color: COLORS.lavender },
  ];

  const trendData = [4, 6, 5, 9, 7, 11, 10, 14];
  const trendMax = Math.max(...trendData);
  const trendMin = Math.min(...trendData);
  const points = trendData
    .map((v, i) => {
      const x = (i / (trendData.length - 1)) * 260;
      const y = 60 - ((v - trendMin) / (trendMax - trendMin || 1)) * 50;
      return `${x},${y}`;
    })
    .join(" ");

  let cumulative = 0;
  const donutSegments = moodData.map((m) => {
    const start = cumulative;
    cumulative += m.value;
    return { ...m, start, end: cumulative };
  });
  const radius = 70;
  const circumference = 2 * Math.PI * radius;

  return (
    <Shell>
      <div style={{ display: "flex", alignItems: "center", gap: "12px", marginBottom: "22px" }}>
        <button
          onClick={onBack}
          style={{
            width: "38px", height: "38px", borderRadius: "50%", background: COLORS.card, border: "none",
            display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer",
            boxShadow: "0 4px 12px rgba(180, 160, 140, 0.15)",
          }}
        >
          <ChevronLeft size={18} color="#6B5F52" />
        </button>
        <h1 style={{ margin: 0, fontSize: "20px", color: COLORS.text, fontWeight: 700 }}>Ta progression</h1>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "10px", marginBottom: "20px" }}>
        {[
          { icon: Flame, label: "Série", value: "4j", bg: "#FBF1E0", color: COLORS.yellow },
          { icon: Clock, label: "Ce mois", value: "2h18", bg: "#E9F1EC", color: COLORS.sage },
          { icon: Calendar, label: "Séances", value: String(23 + sessionsCompleted), bg: "#FBECEE", color: COLORS.pink },
        ].map((s) => (
          <div key={s.label} style={{ background: s.bg, borderRadius: "18px", padding: "14px 10px", textAlign: "center" }}>
            <s.icon size={16} color={s.color} style={{ marginBottom: "6px" }} />
            <p style={{ margin: 0, fontSize: "17px", color: COLORS.text, fontWeight: 700 }}>{s.value}</p>
            <p style={{ margin: "2px 0 0", fontSize: "11px", color: COLORS.subtext, fontWeight: 600 }}>{s.label}</p>
          </div>
        ))}
      </div>

      <div style={{ background: COLORS.card, borderRadius: "22px", padding: "20px", marginBottom: "16px", boxShadow: "0 6px 18px rgba(180, 160, 140, 0.12)" }}>
        <p style={{ margin: "0 0 18px", fontSize: "14px", color: COLORS.text, fontWeight: 700 }}>Minutes cette semaine</p>
        <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", height: "100px" }}>
          {weekData.map((d, i) => (
            <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "8px" }}>
              <div
                style={{
                  width: "22px",
                  height: `${(d.minutes / maxMinutes) * 76 || 3}px`,
                  minHeight: "3px",
                  borderRadius: "8px",
                  background: d.minutes > 0 ? `linear-gradient(180deg, ${COLORS.peach}, ${COLORS.pink})` : "#EDE7DC",
                }}
              />
              <span style={{ fontSize: "11px", color: COLORS.faint, fontWeight: 600 }}>{d.day}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{ background: COLORS.card, borderRadius: "22px", padding: "20px", marginBottom: "16px", boxShadow: "0 6px 18px rgba(180, 160, 140, 0.12)" }}>
        <p style={{ margin: "0 0 14px", fontSize: "14px", color: COLORS.text, fontWeight: 700 }}>Tendance sur 8 semaines</p>
        <svg width="100%" height="70" viewBox="0 0 260 70" preserveAspectRatio="none">
          <defs>
            <linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={COLORS.sage} stopOpacity="0.35" />
              <stop offset="100%" stopColor={COLORS.sage} stopOpacity="0" />
            </linearGradient>
          </defs>
          <polygon points={`0,70 ${points} 260,70`} fill="url(#trendFill)" />
          <polyline points={points} fill="none" stroke={COLORS.sage} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </div>

      <div style={{ background: COLORS.card, borderRadius: "22px", padding: "20px", boxShadow: "0 6px 18px rgba(180, 160, 140, 0.12)" }}>
        <p style={{ margin: "0 0 16px", fontSize: "14px", color: COLORS.text, fontWeight: 700 }}>Ton humeur après méditation</p>
        <div style={{ display: "flex", alignItems: "center", gap: "24px" }}>
          <svg width="180" height="180" viewBox="0 0 180 180">
            {donutSegments.map((seg) => {
              const dash = (seg.value / 100) * circumference;
              const gap = circumference - dash;
              const rotation = (seg.start / 100) * 360 - 90;
              return (
                <circle
                  key={seg.label} cx="90" cy="90" r={radius} fill="none" stroke={seg.color} strokeWidth="24"
                  strokeDasharray={`${dash} ${gap}`} transform={`rotate(${rotation} 90 90)`} strokeLinecap="butt"
                />
              );
            })}
          </svg>
          <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
            {moodData.map((m) => (
              <div key={m.label} style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                <div style={{ width: "10px", height: "10px", borderRadius: "3px", background: m.color }} />
                <span style={{ fontSize: "12px", color: "#6B5F52", fontWeight: 600 }}>{m.label}</span>
                <span style={{ fontSize: "12px", color: COLORS.faint }}>{m.value}%</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </Shell>
  );
}

/* ---------------- APP ROOT ---------------- */
function App() {
  const [screen, setScreen] = useState("home"); // home | session | stats
  const [sessionConfig, setSessionConfig] = useState({ minutes: 3, name: "Respiration calme" });
  const [sessionsCompleted, setSessionsCompleted] = useState(0);

  const startQuickSession = (minutes, name) => {
    setSessionConfig({ minutes, name });
    setScreen("session");
  };

  const finishSession = () => {
    setSessionsCompleted((c) => c + 1);
    setScreen("stats");
  };

  return (
    <div style={{ position: "relative" }}>
      {screen === "home" && <HomeScreen onStartQuick={startQuickSession} />}
      {screen === "session" && (
        <SessionScreen
          initialMinutes={sessionConfig.minutes}
          sessionName={sessionConfig.name}
          onFinish={finishSession}
          onCancel={() => setScreen("home")}
        />
      )}
      {screen === "stats" && <StatsScreen onBack={() => setScreen("home")} sessionsCompleted={sessionsCompleted} />}

      {/* Bottom nav - only on home & stats */}
      {screen !== "session" && (
        <div
          style={{
            position: "fixed",
            bottom: "20px",
            left: "50%",
            transform: "translateX(-50%)",
            width: "calc(100% - 40px)",
            maxWidth: "440px",
            background: "rgba(255,255,255,0.85)",
            backdropFilter: "blur(10px)",
            borderRadius: "22px",
            padding: "10px",
            display: "flex",
            justifyContent: "space-around",
            boxShadow: "0 10px 30px rgba(180, 160, 140, 0.25)",
          }}
        >
          <button
            onClick={() => setScreen("home")}
            style={{
              display: "flex", flexDirection: "column", alignItems: "center", gap: "3px",
              background: "none", border: "none", cursor: "pointer",
              padding: "8px 24px", borderRadius: "14px",
              backgroundColor: screen === "home" ? "#F5E2E8" : "transparent",
            }}
          >
            <HomeIcon size={18} color={screen === "home" ? COLORS.text : COLORS.faint} />
            <span style={{ fontSize: "11px", fontWeight: 600, color: screen === "home" ? COLORS.text : COLORS.faint }}>
              Accueil
            </span>
          </button>
          <button
            onClick={() => setScreen("stats")}
            style={{
              display: "flex", flexDirection: "column", alignItems: "center", gap: "3px",
              background: "none", border: "none", cursor: "pointer",
              padding: "8px 24px", borderRadius: "14px",
              backgroundColor: screen === "stats" ? "#F5E2E8" : "transparent",
            }}
          >
            <BarChart2 size={18} color={screen === "stats" ? COLORS.text : COLORS.faint} />
            <span style={{ fontSize: "11px", fontWeight: 600, color: screen === "stats" ? COLORS.text : COLORS.faint }}>
              Progrès
            </span>
          </button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
